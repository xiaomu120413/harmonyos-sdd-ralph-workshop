<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">复杂需求中的 AI 熟练度成长模型</title>
  <desc id="desc">厂商中立的三层 AI 能力课程图：入口动作、描述能力耐久度，以及贯穿每一层的辨别力。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F1FF"/>
    </linearGradient>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6E56CF"/>
    </marker>
    <style>
      .sans { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #102A43; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #627D98; }
      .ring-label { font-size: 18px; font-weight: 700; fill: #334E68; letter-spacing: 1px; }
      .node { font-size: 18px; font-weight: 700; fill: #243B53; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font-size: 14px; font-weight: 500; fill: #627D98; text-anchor: middle; dominant-baseline: middle; }
      .center-kicker { font-size: 15px; font-weight: 700; fill: #6E56CF; text-anchor: middle; letter-spacing: 2px; }
      .center-main { font-size: 25px; font-weight: 800; fill: #102A43; text-anchor: middle; }
      .card-title { font-size: 22px; font-weight: 800; fill: #102A43; }
      .card-body { font-size: 16px; font-weight: 500; fill: #486581; }
      .check { font-size: 16px; font-weight: 700; fill: #B94A2F; }
      .footer { font-size: 13px; font-weight: 500; fill: #829AB1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F5F0"/>
  <circle cx="80" cy="70" r="28" fill="#6E56CF" opacity="0.12"/>
  <circle cx="1515" cy="820" r="70" fill="#2E8B72" opacity="0.08"/>

  <text x="70" y="78" class="sans title">复杂需求中的 AI 熟练度成长模型</text>
  <text x="72" y="112" class="sans subtitle">不围绕某个产品：先形成入口动作，再提升描述的耐久度，并让辨别与验证贯穿全过程</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="905" height="680" rx="34" fill="url(#panel)"/>
  </g>

  <g transform="translate(495 485)">
    <circle r="310" fill="#2E8B72" opacity="0.035" stroke="#2E8B72" stroke-width="2"/>
    <circle r="225" fill="#2878C8" opacity="0.04" stroke="#2878C8" stroke-width="2"/>
    <circle r="140" fill="#6E56CF" opacity="0.06" stroke="#6E56CF" stroke-width="2"/>
    <circle r="342" fill="none" stroke="#E8754A" stroke-width="4" stroke-dasharray="10 14" opacity="0.9"/>

    <rect x="-106" y="-62" width="212" height="124" rx="62" fill="#FFFFFF" stroke="#6E56CF" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="-27" class="sans center-kicker">入口动作</text>
    <text x="0" y="10" class="sans center-main">澄清目标</text>
    <text x="0" y="42" class="sans center-main">快速迭代</text>

    <path d="M -90 88 A 140 140 0 0 0 92 88" fill="none" stroke="#6E56CF" stroke-width="3" marker-end="url(#arrowPurple)"/>

    <g transform="translate(0 -140)">
      <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#EEEAFE" stroke="#6E56CF"/>
      <text x="0" y="0" class="sans node">目标 / 边界</text>
    </g>
    <g transform="translate(-124 66)">
      <rect x="-66" y="-24" width="132" height="48" rx="24" fill="#EEEAFE" stroke="#6E56CF"/>
      <text x="0" y="0" class="sans node">上下文 / 示例</text>
    </g>
    <g transform="translate(124 66)">
      <rect x="-62" y="-24" width="124" height="48" rx="24" fill="#EEEAFE" stroke="#6E56CF"/>
      <text x="0" y="0" class="sans node">输出 / AC</text>
    </g>

    <g transform="translate(-156 -164)">
      <rect x="-58" y="-23" width="116" height="46" rx="23" fill="#E8F2FC" stroke="#2878C8"/>
      <text x="0" y="0" class="sans node">任务卡</text>
    </g>
    <g transform="translate(174 -142)">
      <rect x="-67" y="-23" width="134" height="46" rx="23" fill="#E8F2FC" stroke="#2878C8"/>
      <text x="0" y="0" class="sans node">工具契约</text>
    </g>
    <g transform="translate(-194 114)">
      <rect x="-74" y="-23" width="148" height="46" rx="23" fill="#E8F2FC" stroke="#2878C8"/>
      <text x="0" y="0" class="sans node">验收清单</text>
    </g>
    <g transform="translate(178 134)">
      <rect x="-67" y="-23" width="134" height="46" rx="23" fill="#E8F2FC" stroke="#2878C8"/>
      <text x="0" y="0" class="sans node">progress</text>
    </g>

    <g transform="translate(0 -310)">
      <rect x="-76" y="-23" width="152" height="46" rx="23" fill="#E4F4EF" stroke="#2E8B72"/>
      <text x="0" y="0" class="sans node">项目规则</text>
    </g>
    <g transform="translate(-276 -62)">
      <rect x="-67" y="-23" width="134" height="46" rx="23" fill="#E4F4EF" stroke="#2E8B72"/>
      <text x="0" y="0" class="sans node">证据库</text>
    </g>
    <g transform="translate(278 -40)">
      <rect x="-67" y="-23" width="134" height="46" rx="23" fill="#E4F4EF" stroke="#2E8B72"/>
      <text x="0" y="0" class="sans node">自动化</text>
    </g>
    <g transform="translate(0 310)">
      <rect x="-67" y="-23" width="134" height="46" rx="23" fill="#E4F4EF" stroke="#2E8B72"/>
      <text x="0" y="0" class="sans node">复盘迭代</text>
    </g>

    <g transform="translate(260 226)">
      <circle r="27" fill="#FFF0EA" stroke="#E8754A" stroke-width="2"/>
      <text x="0" y="1" class="sans node" fill="#B94A2F">?</text>
    </g>
    <text x="220" y="274" class="sans check">辨别力贯穿每一层</text>
  </g>

  <g>
    <rect x="1000" y="160" width="535" height="180" rx="28" fill="#F0ECFF" stroke="#C8BDF8" stroke-width="2"/>
    <circle cx="1048" cy="210" r="22" fill="#6E56CF"/>
    <text x="1048" y="217" class="sans node" fill="#FFFFFF">1</text>
    <text x="1090" y="216" class="sans card-title">入口动作：先教会</text>
    <text x="1040" y="258" class="sans card-body">复杂任务先说清“完成后的状态”，再通过追问</text>
    <text x="1040" y="286" class="sans card-body">和小步反馈迭代。不要把一次长 Prompt 当能力。</text>
    <text x="1040" y="318" class="sans check">检查：AI 假设了什么？目标是否仍有分叉？</text>

    <rect x="1000" y="365" width="535" height="200" rx="28" fill="#EAF7F2" stroke="#A7DCCB" stroke-width="2"/>
    <circle cx="1048" cy="415" r="22" fill="#2E8B72"/>
    <text x="1048" y="422" class="sans node" fill="#FFFFFF">2</text>
    <text x="1090" y="421" class="sans card-title">描述能力：从一次性到持久化</text>
    <text x="1040" y="463" class="sans card-body">一次任务：目标、上下文、示例、输出格式。</text>
    <text x="1040" y="493" class="sans card-body">可复用：任务卡、工具契约、验收清单。</text>
    <text x="1040" y="523" class="sans card-body">持久化：项目规则、progress、证据库与自动化。</text>
    <text x="1040" y="552" class="sans check">检查：这是更多上下文，还是更高信号的上下文？</text>

    <rect x="1000" y="590" width="535" height="200" rx="28" fill="#FFF0EA" stroke="#F4B49E" stroke-width="2"/>
    <circle cx="1048" cy="640" r="22" fill="#E8754A"/>
    <text x="1048" y="647" class="sans node" fill="#FFFFFF">3</text>
    <text x="1090" y="646" class="sans card-title">辨别力：每一步都回访</text>
    <text x="1040" y="688" class="sans card-body">可见结果只证明“发生了什么”，不自动证明正确。</text>
    <text x="1040" y="718" class="sans card-body">用反例、测试、来源、日志和最终系统状态质疑它。</text>
    <text x="1040" y="748" class="sans card-body">把每次失败变成下一轮任务与评测案例。</text>
    <text x="1040" y="777" class="sans check">检查：什么会让它错？证据够不够？何时停止？</text>
  </g>

  <text x="70" y="866" class="sans footer">课程自绘 · 方法参考 Anthropic Claude Academy 的 AI Fluency Curriculum · 去除具体产品与功能层级，保留可迁移教学规律</text>
</svg>
